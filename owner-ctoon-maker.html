<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CToon Maker | CTooniverse</title><link rel="stylesheet" href="styles.css?v=background-harmony-20261114"><link rel="stylesheet" href="arcade-polish.css"><script src="script.js?v=logo-all-pages-20261114" defer></script><script type="module" src="ctoon-maker.js?v=20261113-delete" defer></script><style>main{max-width:1100px;margin:30px auto;padding:20px}.maker-panel{background:#15163e;border:2px solid #66d7ff;border-radius:18px;padding:20px;margin:18px 0}#ctoon-maker-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}#ctoon-maker-form label{display:grid;gap:7px;font-weight:700}#ctoon-maker-form input,#ctoon-maker-form select,#ctoon-maker-search{width:100%;padding:12px;background:#101532;border:2px solid #77baff;color:white;border-radius:9px}.maker-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.music-admin-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #6572a4}#ctoon-maker-preview img{object-fit:contain;max-height:282px}</style></head><body><main><a class="button secondary" href="owner.html">← Owner Dashboard</a><h1>CToon Maker & Editor</h1><p>Add new CToons to the live catalog, or edit existing ones. Only verified owners can save.</p><p id="ctoon-maker-status" role="status" aria-live="polite">Verifying owner access…</p><section class="maker-panel"><h2>Create or edit CToon</h2><form id="ctoon-maker-form" hidden><label>Name<input id="ctoon-maker-title" maxlength="90" required></label><input id="ctoon-maker-set" type="hidden" value="Cartoon & Anime"><label>Subseries<input id="ctoon-maker-series" list="ctoon-maker-series-options" required autocomplete="off"><datalist id="ctoon-maker-series-options"></datalist></label><label>Artwork path or HTTPS URL<input id="ctoon-maker-image" required placeholder="public/images/ctoons/character.png"></label><label>Rarity<select id="ctoon-maker-rarity"><option>Common</option><option>Uncommon</option><option>Rare</option><option>Epic</option><option>Legendary</option></select></label><label>Price in coins<input id="ctoon-maker-price" type="number" min="0" max="1000000" value="100" required></label><label>For sale<input id="ctoon-maker-sale" type="checkbox"></label><div class="maker-actions"><button class="button primary" id="ctoon-maker-save" type="submit">Create CToon</button><button class="button secondary" id="ctoon-maker-new" type="button">New CToon</button><button class="button" id="ctoon-maker-delete" type="button" hidden disabled style="background:#8d1f35;border:2px solid #ff7488;color:#fff">Delete CToon</button></div></form><div id="ctoon-maker-preview"></div><p>Upload artwork to <code>public/images/ctoons/</code> in GitHub first, or use a direct HTTPS image URL.</p></section><section class="maker-panel"><h2>Existing CToons</h2><input id="ctoon-maker-search" type="search" placeholder="Search CToons"><div class="maker-actions"><button id="ctoon-maker-reload" class="button secondary" type="button">Refresh</button><button id="ctoon-maker-export" class="button secondary" type="button">Export backup</button></div><div id="ctoon-maker-existing"></div></section></main></body></html>
