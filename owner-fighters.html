<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fighter Manager | CTooniverse</title><link rel="stylesheet" href="fighters.css"></head><body class="fighters-page"><main class="fighters-shell"><a href="owner.html">← Owner Dashboard</a><h1>Fighter Manager</h1><p>Owner-only character catalog. Add fighters and configure how players unlock them.</p><p id="status" role="status">Verifying owner access…</p><section id="manager" class="fighter-select" hidden><h2>Add or Edit Fighter</h2><form id="fighter-form" class="owner-fighter-form"><label>Fighter ID <input id="fighter-id" required pattern="[a-z0-9][a-z0-9_-]*" maxlength="80" placeholder="example_fighter"></label><label>Name <input id="fighter-name" required maxlength="100"></label><label>Series <input id="fighter-series" required maxlength="100"></label><label>Portrait URL (optional) <input id="fighter-portrait" type="text" placeholder="/images/fighters/example.png"></label><label>Unlock method <select id="fighter-method"><option value="free">Free</option><option value="coins">Coins</option><option value="achievement">Achievement</option></select></label><label>Coin cost <input id="fighter-cost" type="number" min="1" max="100000000"></label><label>Achievement key <input id="fighter-achievement" maxlength="100" placeholder="win_10_matches"></label><label><input id="fighter-enabled" type="checkbox" checked> Visible in roster</label><button type="submit">Save Fighter</button></form><h2>Existing Fighters</h2><div id="fighter-list"></div><h2>Grant a Fighter</h2><p>Owner-only manual unlock for a player. Achievement awards are not yet automated.</p><form id="grant-form" class="owner-fighter-form"><label>Player user UUID <input id="grant-user" required></label><label>Fighter ID <input id="grant-fighter" required></label><button type="submit">Grant Unlock</button></form></section></main><script type="module" src="owner-fighters.js"></script></body></html>
