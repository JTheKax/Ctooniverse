<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CToon Showdown — Arcade Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#09071b;color:white;font:700 16px system-ui;text-align:center}h1{font-size:clamp(24px,5vw,46px);margin:12px;color:#fce754;text-shadow:3px 3px #db228d}main{max-width:1100px;margin:auto;padding:8px}canvas{width:100%;aspect-ratio:16/9;background:#111;box-shadow:0 0 35px #673dfb;border:4px solid #7d5fff;touch-action:none}button{cursor:pointer;border:2px solid #fff;background:#5924bd;color:white;border-radius:8px;padding:12px;margin:4px;font-weight:900}button:hover{background:#c12691}.controls{display:flex;flex-wrap:wrap;justify-content:center}small{display:block;color:#c5bdf5;margin:8px}</style><main><h1>⚡ CTOON SHOWDOWN ⚡</h1><canvas id="arena" width="960" height="540" aria-label="2D arcade fighting game"></canvas><div class="controls"><button data-k="a">◀</button><button data-k="d">▶</button><button data-k="w">JUMP</button><button data-k="j">LIGHT</button><button data-k="k">HEAVY</button><button data-k="l">SPECIAL</button><button data-k="q">TAG</button><button data-k="e">ASSIST</button><button id="reset">RESTART</button></div><small>Keyboard: A/D move · W jump · J light · K heavy · L special · Q tag · E assist. First to knock out the opposing team wins.</small></main><script>
const c=document.getElementById('arena'),g=c.getContext('2d'),keys=new Set();let last=0,ended=false,shake=0,flash=0;
const names=['Johnny Bravo','Samurai Jack','Kim Possible'],foes=['Perfect Cell','Burter','Jeice'];
function team(n,enemy){return {names:n,active:0,hp:[100,100,100],meter:0,x:enemy?730:230,y:420,vy:0,face:enemy?-1:1,stun:0,attack:0,cool:0,tagCool:0,enemy,color:enemy?'#f34baf':'#4ee7ff'};}
let p=team(names,false),cpu=team(foes,true);
function reset(){p=team(names,false);cpu=team(foes,true);ended=false;flash=0;shake=0}document.getElementById('reset').onclick=reset;
addEventListener('keydown',e=>{if(['a','d','w','j','k','l','q','e',' '].includes(e.key.toLowerCase()))e.preventDefault();keys.add(e.key.toLowerCase())});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys.add(k)};for(let ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys.delete(k))});
function hit(a,b,power,range){if(a.cool>0||ended)return;if(Math.abs(a.x-b.x)<range&&Math.abs(a.y-b.y)<85&&b.stun<=0){b.hp[b.active]=Math.max(0,b.hp[b.active]-power);b.stun=power>12?18:10;b.vy=power>12?-5:b.vy;b.x+=a.face*22;a.meter=Math.min(100,a.meter+power*1.5);shake=8;flash=6}a.attack=12;a.cool=power>12?32:17;}
function swap(t){if(t.tagCool>0)return;let next=[1,2,0].map(i=>(t.active+i)%3).find(i=>t.hp[i]>0);if(next!==undefined){t.active=next;t.tagCool=80;flash=12}}
function step(t,other,dt){t.cool=Math.max(0,t.cool-dt);t.stun=Math.max(0,t.stun-dt);t.attack=Math.max(0,t.attack-dt);t.tagCool=Math.max(0,t.tagCool-dt);t.vy+=.75*dt;t.y+=t.vy*dt;if(t.y>420){t.y=420;t.vy=0}t.x=Math.max(60,Math.min(900,t.x));t.face=other.x>t.x?1:-1;if(t.hp[t.active]<=0)swap(t)}
function update(dt){if(ended)return;step(p,cpu,dt);step(cpu,p,dt);if(p.stun<=0){if(keys.has('a'))p.x-=5*dt;if(keys.has('d'))p.x+=5*dt;if(keys.has('w')&&p.y>=420)p.vy=-14;if(keys.has('j'))hit(p,cpu,5,115);if(keys.has('k'))hit(p,cpu,11,125);if(keys.has('l')&&p.meter>=30&&p.cool<=0){p.meter-=30;hit(p,cpu,22,240)}if(keys.has('q'))swap(p);if(keys.has('e')&&p.meter>=20&&p.cool<=0){p.meter-=20;hit(p,cpu,14,260)}}if(cpu.stun<=0){let dx=p.x-cpu.x;if(Math.abs(dx)>100)cpu.x+=Math.sign(dx)*2.3*dt;else if(cpu.cool<=0)hit(cpu,p,Math.random()<.3?11:5,120);if(Math.random()<.002*dt&&cpu.y>=420)cpu.vy=-13}if(p.hp.every(h=>h<=0)||cpu.hp.every(h=>h<=0))ended=true;shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt)}
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function txt(s,x,y,size,color='#fff',align='left'){g.fillStyle=color;g.textAlign=align;g.font='900 '+size+'px system-ui';g.fillText(s,x,y)}
function fighter(t){g.save();g.translate(t.x,t.y);g.scale(t.face,1);g.shadowColor=t.color;g.shadowBlur=20;rect(-25,-102,50,82,t.color);rect(-24,-20,17,20,'#222');rect(7,-20,17,20,'#222');g.fillStyle=t.enemy?'#a64ed7':'#ffe1a5';g.beginPath();g.arc(0,-123,29,0,Math.PI*2);g.fill();rect(-38,-90,13,50,t.color);rect(25,-90,t.attack?75:13,13,t.attack?'#ffe85d':t.color);g.restore();txt(t.names[t.active],t.x,t.y-170,18,'#fff','center')}
function draw(){g.save();if(shake)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);let bg=g.createLinearGradient(0,0,0,540);bg.addColorStop(0,'#15103d');bg.addColorStop(1,'#8429a1');rect(0,0,960,540,bg);for(let i=0;i<16;i++){rect(i*70,190+(i%4)*25,45,230,'#1d174d');rect(i*70+8,220+(i%4)*25,12,15,'#ff4dd8')}rect(0,420,960,120,'#21143f');for(let i=0;i<20;i++){g.strokeStyle='#7745f1';g.beginPath();g.moveTo(i*60,420);g.lineTo(480+(i-10)*110,540);g.stroke()}fighter(p);fighter(cpu);g.restore();rect(30,35,380,23,'#2b1948');rect(550,35,380,23,'#2b1948');rect(30,35,380*p.hp[p.active]/100,23,'#4be7ff');rect(930-380*cpu.hp[cpu.active]/100,35,380*cpu.hp[cpu.active]/100,23,'#ff57aa');txt('PLAYER 1',30,25,17);txt('CPU',930,25,17,'#fff','right');txt('VS',480,57,32,'#ffe759','center');for(let i=0;i<3;i++){txt(p.names[i]+': '+Math.ceil(p.hp[i]),30,85+i*20,13,i===p.active?'#fff':'#8b8cbb');txt(cpu.names[i]+': '+Math.ceil(cpu.hp[i]),930,85+i*20,13,i===cpu.active?'#fff':'#8b8cbb','right')}rect(30,495,260,15,'#281a53');rect(30,495,260*p.meter/100,15,'#ffe759');rect(670,495,260,15,'#281a53');rect(670,495,260*cpu.meter/100,15,'#ffe759');txt('SUPER',30,487,13);txt('SUPER',930,487,13,'#fff','right');if(flash){g.fillStyle='rgba(255,255,255,'+(flash/50)+')';g.fillRect(0,0,960,540)}if(ended){rect(250,205,460,105,'#130e33');txt(p.hp.every(h=>h<=0)?'CPU WINS':'YOU WIN!',480,273,48,'#ffe759','center')}}
function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
