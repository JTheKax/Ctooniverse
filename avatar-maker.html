<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avatar Maker | CTooniverse</title><link rel="stylesheet" href="styles.css?v=avatar-maker-1"><script src="script.js" defer></script><script src="owner-menu.js" defer></script><style>body{background:#0c1235;color:#fff}.avatar-wrap{max-width:940px;margin:0 auto;padding:20px}.avatar-wrap h1{color:#ffe074}.avatar-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px}.avatar-stage,.avatar-controls{background:#1c1951;border:3px solid #9178ef;border-radius:19px;padding:18px;box-shadow:5px 6px #090b24}.avatar-stage img{display:block;width:100%;border:5px solid #f1ca5b;border-radius:20px;background:#2b176a}.avatar-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.avatar-controls label{display:grid;gap:6px;font-weight:800}.avatar-controls select,.avatar-controls input{width:100%;box-sizing:border-box;min-height:42px;background:#0d1841;color:#fff;border:2px solid #8f79e6;border-radius:9px;padding:6px}.avatar-controls input[type=color]{padding:3px}.avatar-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.avatar-actions button{padding:12px 22px;background:#6237ba;color:white;border:2px solid #ffda60;border-radius:12px;font-weight:900;cursor:pointer}#avatar-message{min-height:22px}@media(max-width:650px){.avatar-layout{grid-template-columns:1fr}.avatar-stage{max-width:290px;margin:auto}.avatar-controls{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px}.avatar-wrap{padding:12px}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><img class="brand-logo" src="ctooniverse-logo.png" alt="CTooniverse" width="300" height="100"></a><nav aria-label="Main navigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="account.html">My Profile</a><a class="nav-link" href="clash.html">⚔ CToon Clash</a><div class="owner-menu owner-nav" style="display:none!important"><button type="button" class="nav-link owner-menu-trigger">♛ Owner</button><div class="owner-menu-panel"></div></div></nav></header><main class="avatar-wrap"><a href="account.html">← Back to Profile</a><h1>🎨 My Avatar Maker</h1><p>Draw your own CTooniverse look. Your saved avatar appears on your profile and in CToon Clash.</p><div class="avatar-layout"><section class="avatar-stage"><img id="avatar-preview" alt="Your customized avatar" width="260" height="286"><p id="avatar-message" role="status">Sign in to save your avatar.</p><div class="avatar-actions"><button type="button" id="avatar-random">Surprise Me</button><button type="button" id="avatar-save">Save Avatar</button></div></section><form class="avatar-controls" id="avatar-form"><label>Hairstyle<select name="style"><option value="swoop">Swoop</option><option value="spikes">Spiky</option><option value="curls">Curly</option><option value="bob">Bob</option><option value="bald">No Hair</option></select></label><label>Expression<select name="face"><option value="smile">Smile</option><option value="grin">Big Grin</option><option value="serious">Serious</option></select></label><label>Accessories<select name="accessory"><option value="none">None</option><option value="glasses">Glasses</option><option value="crown">Crown</option><option value="headphones">Headphones</option></select></label><label>Outfit style<select name="outfit"><option value="hoodie">Arcade Hoodie</option><option value="jacket">Hero Jacket</option><option value="armor">Battle Armor</option><option value="tee">Classic Tee</option></select></label><label>Neon aura<select name="aura"><option value="stars">Starlight</option><option value="lightning">Electric</option><option value="flames">Flame Power</option><option value="none">None</option></select></label><label>Face details<select name="detail"><option value="none">None</option><option value="freckles">Freckles</option><option value="blush">Blush</option><option value="scar">Battle Scar</option></select></label><label>Skin tone<input name="skin" type="color" value="#f2b989"></label><label>Hair color<input name="hair" type="color" value="#30204d"></label><label>Eye color<input name="eyes" type="color" value="#36d5ed"></label><label>Outfit color<input name="shirt" type="color" value="#6545d7"></label><label>Background<input name="background" type="color" value="#2b176a"></label></form></div></main><script type="module" src="avatar-maker.js?v=2"></script></body></html>
